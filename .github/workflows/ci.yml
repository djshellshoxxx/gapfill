name: CI

on:
  push:
    branches:
      - master
      - audit-fixes-20261005
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install JUCE build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build xvfb libasound2-dev libfreetype-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev \
            libxrandr-dev libxrender-dev

      - name: Fetch JUCE
        run: git clone --depth 1 --branch 8.0.15 https://github.com/juce-framework/JUCE JUCE

      - name: Configure
        run: cmake -S . -B build-ci -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build tests and VST3
        run: cmake --build build-ci --target GapFillTests GapFill_VST3 -- -j2

      - name: Run tests
        run: xvfb-run -a build-ci/artefacts/GapFillTests

  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Fetch JUCE
        shell: pwsh
        run: git clone --depth 1 --branch 8.0.15 https://github.com/juce-framework/JUCE JUCE

      - name: Configure
        shell: pwsh
        run: cmake -S . -B build-ci -G "Visual Studio 17 2022" -A x64

      - name: Build tests and VST3
        shell: pwsh
        run: cmake --build build-ci --config Release --target GapFillTests GapFill_VST3 -- /m:2

      - name: Run tests
        shell: pwsh
        run: .\build-ci\artefacts\Release\GapFillTests.exe
