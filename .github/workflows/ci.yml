name: CI

# Job graph (details: docs/dev/07-QA-AND-RELEASE.md, docs/dev/09-FAST-INCREMENTAL-BUILDS.md)
#
#   changes ─┐
#   preflight ┴─> unit-tests (Linux, full suite once) ─┬─> build-linux-x64
#                                                      ├─> build-windows-x64
#                                                      ├─> build-macos (arm64, x86_64)
#                                                      └─> ci-gate (single required check)
#
# Only unit-tests runs the full suite (including Combinatorial). Windows and
# macOS run a fast smoke subset (SMOKE_FILTER) next to their plugin validators.
# Docs-only changes still run preflight but skip every native job.
on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

concurrency:
  # Superseded PR runs are cancelled. Pushes to master and manual runs are keyed
  # by SHA so a release candidate's artifacts are never cancelled by a later push.
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('sha-{0}', github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Test group/name filter for the Windows/macOS smoke run (GapFillTests <filter>).
  # "Plugin" = processor lifecycle, sample-rate/block-size/layout and format-level tests,
  # the platform-sensitive part of the suite. DSP/golden/combinatorial run once on Linux.
  SMOKE_FILTER: Plugin

jobs:
  changes:
    name: Detect native changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      native: ${{ steps.detect.outputs.native }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: detect
        name: Docs-only changes skip native jobs
        shell: bash
        run: |
          set -euo pipefail
          case "${{ github.event_name }}" in
            pull_request) base="${{ github.event.pull_request.base.sha }}" ;;
            push)         base="${{ github.event.before }}" ;;
            *)            base="" ;;   # workflow_dispatch always builds natively
          esac
          result="$(bash tools/ci_detect_native_changes.sh "$base" "${{ github.sha }}")"
          echo "$result"
          echo "$result" >> "$GITHUB_OUTPUT"

  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Repository preflight
        run: python tools/validate_repo.py
      - name: Preflight unit tests
        run: python -m unittest tools/test_validate_repo.py tools/test_check_hot_files.py

      - name: Hot-file ownership (pull requests)
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          BASE_REF: ${{ github.base_ref }}
        run: python tools/check_hot_files.py --title "$PR_TITLE" --labels "$PR_LABELS" --base "origin/$BASE_REF"

      - name: Windows, Linux and macOS packaging regression (synthetic fixtures)
        run: bash tools/test_package_release.sh

      - name: CI helper script regression
        run: bash tools/test_ci_helpers.sh

      - name: Workflow YAML and shell syntax
        run: |
          python3 -c "import yaml" 2>/dev/null || python3 -m pip install --quiet pyyaml
          python3 - <<'PY'
          import glob, yaml
          for f in sorted(glob.glob('.github/workflows/*.yml')):
              yaml.safe_load(open(f, encoding='utf-8'))
              print('ok', f)
          PY
          for s in packaging/*.sh tools/*.sh tools/dev/*.sh; do bash -n "$s"; echo "ok $s"; done

  unit-tests:
    name: unit-tests (Linux, full suite)
    needs: [changes, preflight]
    if: needs.changes.outputs.native == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 500M
      CCACHE_COMPRESS: '1'
    steps:
      - uses: actions/checkout@v4

      - name: Cache JUCE and CLAP support checkouts
        uses: actions/cache@v4
        with:
          path: |
            JUCE
            clap-juce-extensions
          key: deps-${{ runner.os }}-${{ hashFiles('tools/ci_fetch_deps.sh') }}

      - name: Fetch JUCE and CLAP support
        run: bash tools/ci_fetch_deps.sh

      - name: Install JUCE build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build ccache xvfb libasound2-dev libfreetype-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev \
            libxrandr-dev libxrender-dev

      - name: Restore compiler cache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-linux-tests-${{ github.sha }}
          restore-keys: ccache-linux-tests-

      - name: Configure
        run: |
          cmake -S . -B build-ci -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build GapFillTests
        run: |
          ccache -z
          cmake --build build-ci --target GapFillTests -- -j"$(nproc)"
          ccache -s

      - name: Run full unit, golden and combinatorial suite
        run: |
          set -o pipefail
          mkdir -p test-results
          set +e
          xvfb-run -a build-ci/artefacts/GapFillTests 2>&1 | tee test-results/GapFillTests-linux-full.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            echo "::group::Failing tests"
            grep -n -A3 '\[FAIL\]' test-results/GapFillTests-linux-full.log || true
            echo "::endgroup::"
            grep -h -A3 '\[FAIL\]' test-results/GapFillTests-linux-full.log | head -40 | while IFS= read -r l; do echo "::error::$l"; done
          fi
          exit "$status"

      - name: Golden diagnostics (only after a failure)
        if: failure()
        run: |
          lscpu | grep -E 'Model name|Flags' | cut -c1-400 || true
          mkdir -p golden-actual
          xvfb-run -a build-ci/artefacts/GapFillTests --write-golden Golden > golden-actual/write.log 2>&1 || true
          cp -r Tests/golden/linux golden-actual/ || true

      - name: Upload golden diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-actual
          path: golden-actual/
          if-no-files-found: warn
          retention-days: 7

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: test-results/
          if-no-files-found: warn
          retention-days: 30

  build-linux-x64:
    name: build-linux-x64 (VST3, CLAP, Standalone)
    needs: [changes, unit-tests]
    if: needs.changes.outputs.native == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 500M
      CCACHE_COMPRESS: '1'
    steps:
      - uses: actions/checkout@v4

      - name: Cache JUCE and CLAP support checkouts
        uses: actions/cache@v4
        with:
          path: |
            JUCE
            clap-juce-extensions
          key: deps-${{ runner.os }}-${{ hashFiles('tools/ci_fetch_deps.sh') }}

      - name: Fetch JUCE and CLAP support
        run: bash tools/ci_fetch_deps.sh

      - name: Install JUCE build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build ccache xvfb libasound2-dev libfreetype-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev \
            libxrandr-dev libxrender-dev

      - name: Restore compiler cache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-linux-build-${{ github.sha }}
          restore-keys: ccache-linux-build-

      - name: Configure
        run: |
          cmake -S . -B build-ci -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build VST3, CLAP and Standalone
        run: |
          ccache -z
          cmake --build build-ci --target GapFill_VST3 GapFill_CLAP GapFill_Standalone -- -j"$(nproc)"
          ccache -s

      - name: Validator cache key (refreshed monthly)
        id: month
        run: echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"

      - name: Restore pluginval
        id: pluginval-cache
        uses: actions/cache@v4
        with:
          path: pluginval-bin
          key: pluginval-linux-${{ steps.month.outputs.month }}

      - name: Restore clap-validator
        id: clapval-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/clap-validator
          key: clap-validator-linux-x64-${{ steps.month.outputs.month }}

      - name: Validate VST3 with pluginval
        run: |
          if [ ! -d pluginval-bin ]; then
            curl -fL "https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Linux.zip" -o pluginval.zip
            unzip -q pluginval.zip -d pluginval-bin
          fi
          PLUGINVAL=$(find pluginval-bin -type f -name pluginval | head -n 1)
          test -n "$PLUGINVAL"
          chmod +x "$PLUGINVAL"
          VST3=$(find build-ci -type d -name 'GapFill.vst3' | head -n 1)
          test -n "$VST3"
          xvfb-run -a "$PLUGINVAL" --strictness-level 10 --validate "$VST3"

      - name: Validate CLAP with clap-validator
        run: |
          if ! command -v clap-validator >/dev/null 2>&1 && [ ! -x "$HOME/.cargo/bin/clap-validator" ]; then
            cargo install --git https://github.com/free-audio/clap-validator --locked clap-validator
          fi
          export PATH="$HOME/.cargo/bin:$PATH"
          CLAP=$(find build-ci -type f -name 'GapFill.clap' | head -n 1)
          test -n "$CLAP"
          clap-validator validate --only-failed "$CLAP"

      - name: Smoke-launch standalone
        run: |
          STANDALONE=$(find build-ci/artefacts -type f -name 'GapFill' -perm -111 | head -n 1)
          test -n "$STANDALONE"
          set +e
          timeout 5s xvfb-run -a "$STANDALONE"
          code=$?
          set -e
          if [ "$code" -ne 124 ]; then
            echo "Standalone exited before the 5-second smoke window (exit $code)"
            exit 1
          fi

      - name: Upload verified Linux release binaries
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: gapfill-linux-x64
          path: |
            build-ci/GapFill_artefacts/Release/VST3/GapFill.vst3/
            build-ci/GapFill_artefacts/Release/CLAP/GapFill.clap
            build-ci/artefacts/GapFill
          if-no-files-found: error
          retention-days: 90

  build-windows-x64:
    name: build-windows-x64 (VST3, CLAP, Standalone)
    needs: [changes, unit-tests]
    if: needs.changes.outputs.native == 'true'
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Cache JUCE and CLAP support checkouts
        uses: actions/cache@v4
        with:
          path: |
            JUCE
            clap-juce-extensions
          key: deps-${{ runner.os }}-${{ hashFiles('tools/ci_fetch_deps.sh') }}

      - name: Fetch JUCE and CLAP support
        shell: bash
        run: bash tools/ci_fetch_deps.sh

      # No compiler cache here: the Visual Studio generator ignores
      # CMAKE_<LANG>_COMPILER_LAUNCHER and a Ninja+MSVC+ccache setup is not
      # reliable enough to gate releases on. See docs/dev/09.
      - name: Configure
        shell: pwsh
        run: cmake -S . -B build-ci -G "Visual Studio 17 2022" -A x64

      - name: Build smoke tests, VST3, CLAP and Standalone
        shell: pwsh
        run: cmake --build build-ci --config Release --target GapFillTests GapFill_VST3 GapFill_CLAP GapFill_Standalone -- /m

      - name: Run smoke subset of tests (full suite runs once on Linux)
        shell: pwsh
        run: |
          .\build-ci\artefacts\Release\GapFillTests.exe $env:SMOKE_FILTER
          if ($LASTEXITCODE -ne 0) { throw "GapFillTests ($env:SMOKE_FILTER) failed with exit code $LASTEXITCODE" }

      - name: Validator cache key (refreshed monthly)
        id: month
        shell: bash
        run: echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"

      - name: Restore pluginval
        uses: actions/cache@v4
        with:
          path: pluginval-bin
          key: pluginval-windows-${{ steps.month.outputs.month }}

      - name: Restore clap-validator
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/clap-validator.exe
          key: clap-validator-windows-x64-${{ steps.month.outputs.month }}

      - name: Validate VST3 with pluginval
        shell: pwsh
        run: |
          if (-not (Test-Path pluginval-bin)) {
            Invoke-WebRequest "https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip" -OutFile pluginval.zip
            Expand-Archive pluginval.zip -DestinationPath pluginval-bin
          }
          $pluginval = Get-ChildItem pluginval-bin -Recurse -Filter pluginval.exe | Select-Object -First 1
          if (-not $pluginval) { throw "pluginval.exe not found" }
          $vst3 = Join-Path $PWD 'build-ci\GapFill_artefacts\Release\VST3\GapFill.vst3'
          if (-not (Test-Path $vst3 -PathType Container)) { throw "Release VST3 bundle not found at $vst3" }
          $vst3Binary = Get-ChildItem $vst3 -Recurse -File -Filter GapFill.vst3 | Select-Object -First 1
          if (-not $vst3Binary) { throw "Release VST3 binary missing from $vst3" }
          # pluginval is a Windows GUI-subsystem executable: direct invocation can
          # return before the validator finishes, leaving LASTEXITCODE unset.
          # Wait explicitly and retain separate output streams for failure triage.
          New-Item -ItemType Directory -Force -Path pluginval-diagnostics | Out-Null
          $stdout = Join-Path $PWD 'pluginval-diagnostics/pluginval-stdout.log'
          $stderr = Join-Path $PWD 'pluginval-diagnostics/pluginval-stderr.log'
          $arguments = "--strictness-level 10 --validate `"$vst3`""
          $validation = Start-Process -FilePath $pluginval.FullName -ArgumentList $arguments -Wait -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          if (Test-Path $stdout) { Get-Content $stdout }
          if (Test-Path $stderr) { Get-Content $stderr }
          if ($validation.ExitCode -ne 0) { throw "pluginval failed with exit code $($validation.ExitCode); inspect uploaded diagnostics" }

      - name: Upload Windows pluginval diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-pluginval-diagnostics
          path: pluginval-diagnostics/
          if-no-files-found: ignore
          retention-days: 14

      - name: Validate CLAP with clap-validator
        if: ${{ success() || failure() }}
        shell: pwsh
        run: |
          if (-not (Test-Path "$HOME/.cargo/bin/clap-validator.exe")) {
            cargo install --git https://github.com/free-audio/clap-validator --locked clap-validator
          }
          $env:PATH = "$HOME/.cargo/bin;$env:PATH"
          $clap = Join-Path $PWD 'build-ci\GapFill_artefacts\Release\CLAP\GapFill.clap'
          if (-not (Test-Path $clap -PathType Leaf)) { throw "Release CLAP binary not found at $clap" }
          clap-validator validate --only-failed $clap
          if ($LASTEXITCODE -ne 0) { throw "clap-validator failed with exit code $LASTEXITCODE" }

      - name: Smoke-launch standalone
        if: ${{ success() || failure() }}
        shell: pwsh
        run: |
          $standalone = Join-Path $PWD 'build-ci\artefacts\Release\GapFill.exe'
          if (-not (Test-Path $standalone -PathType Leaf)) { throw "Release standalone missing at $standalone" }
          $process = Start-Process $standalone -PassThru
          Start-Sleep -Seconds 5
          if ($process.HasExited) {
            throw "Standalone exited before the 5-second smoke window with code $($process.ExitCode)"
          }
          Stop-Process -Id $process.Id -Force

      # The NSIS installer is compiled from these verified binaries by
      # release-beta.yml (packaging/package_release.sh + makensis); icon.ico
      # travels with the artifact for that step.
      - name: Upload verified Windows release binaries
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: gapfill-windows-x64
          path: |
            build-ci/GapFill_artefacts/Release/VST3/GapFill.vst3/
            build-ci/GapFill_artefacts/Release/CLAP/GapFill.clap
            build-ci/GapFill_artefacts/JuceLibraryCode/icon.ico
            build-ci/artefacts/Release/GapFill.exe
          if-no-files-found: error
          retention-days: 90

  package-windows:
    name: Package Windows beta (dry run)
    needs: [changes, build-windows-x64]
    if: needs.changes.outputs.native == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Install Windows installer packaging dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends nsis zip unzip file

      - name: Download validated Windows build
        uses: actions/download-artifact@v4
        with:
          name: gapfill-windows-x64
          path: raw/windows

      - name: Package installer and plugin ZIPs
        run: |
          set -euo pipefail
          bash tools/release_stage_artifacts.sh windows raw/windows stage/win-build
          bash packaging/package_release.sh stage/win-build "" dist

      - name: Verify release packages
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum -c GapFill-0.0.1-beta-SHA256SUMS.txt
          for kind in Setup.exe Portable.zip VST3.zip CLAP.zip; do
            test -s "GapFill-0.0.1-beta-Windows-x64-$kind"
          done
          unzip -Z1 GapFill-0.0.1-beta-Windows-x64-Portable.zip | grep -qx 'GapFill.exe'
          unzip -Z1 GapFill-0.0.1-beta-Windows-x64-VST3.zip | grep -q 'GapFill.vst3/Contents/'
          unzip -Z1 GapFill-0.0.1-beta-Windows-x64-CLAP.zip | grep -qx 'GapFill.clap'
          file GapFill-0.0.1-beta-Windows-x64-Setup.exe | grep -qi 'PE32'

  build-macos:
    name: build-macos-${{ matrix.arch }} (VST3, AU, CLAP, Standalone)
    needs: [changes, unit-tests]
    if: needs.changes.outputs.native == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 65
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 500M
      CCACHE_COMPRESS: '1'
    steps:
      - uses: actions/checkout@v4

      - name: Verify native architecture and tools
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "${{ matrix.arch }}"
          xcodebuild -version
          cmake --version
          brew install ninja ccache

      - name: Cache JUCE and CLAP support checkouts
        uses: actions/cache@v4
        with:
          path: |
            JUCE
            clap-juce-extensions
          key: deps-${{ runner.os }}-${{ hashFiles('tools/ci_fetch_deps.sh') }}

      - name: Fetch JUCE and CLAP support
        shell: bash
        run: bash tools/ci_fetch_deps.sh

      - name: Restore compiler cache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-macos-${{ matrix.arch }}-${{ github.sha }}
          restore-keys: ccache-macos-${{ matrix.arch }}-

      # Ninja (not Xcode) so the ccache compiler launcher is honoured.
      - name: Configure Release for native architecture
        shell: bash
        run: |
          cmake -S . -B build-ci -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch }} -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0 \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_OBJC_COMPILER_LAUNCHER=ccache -DCMAKE_OBJCXX_COMPILER_LAUNCHER=ccache

      - name: Build smoke tests, VST3, AU, CLAP and Standalone
        shell: bash
        run: |
          ccache -z
          cmake --build build-ci --target GapFillTests GapFill_VST3 GapFill_AU GapFill_CLAP GapFill_Standalone
          ccache -s

      - name: Run smoke subset of tests (full suite runs once on Linux)
        shell: bash
        run: |
          set -euo pipefail
          tests="$(find build-ci/artefacts -type f -name GapFillTests -perm -111 | head -n 1)"
          test -n "$tests"
          "$tests" "$SMOKE_FILTER"

      - name: Verify native bundles and architecture
        shell: bash
        run: |
          set -euo pipefail
          root=build-ci/GapFill_artefacts/Release
          for format in VST3 AU CLAP; do
            test -d "$root/$format" || { echo "Missing $format bundle directory"; exit 1; }
          done
          vst3="$root/VST3/GapFill.vst3"
          au="$root/AU/GapFill.component"
          clap="$root/CLAP/GapFill.clap"
          app="$(find build-ci/artefacts -type d -name GapFill.app | head -n 1)"
          test -d "$vst3"
          test -d "$au"
          test -e "$clap"
          test -n "$app" && test -d "$app"
          echo "GAPFILL_APP=$app" >> "$GITHUB_ENV"
          find "$vst3" "$au" "$app" -type f -print | head -40
          # Explicitly fail on missing or wrong-architecture executables.
          for bundle in "$vst3" "$au" "$app"; do
            binary="$bundle/Contents/MacOS/GapFill"
            test -f "$binary"
            lipo "$binary" -verify_arch "${{ matrix.arch }}"
          done
          if [ -f "$clap" ]; then
            lipo "$clap" -verify_arch "${{ matrix.arch }}"
          else
            test -f "$clap/Contents/MacOS/GapFill"
            lipo "$clap/Contents/MacOS/GapFill" -verify_arch "${{ matrix.arch }}"
          fi

      # Ninja-built bundles come out of the linker's ad-hoc signature without a
      # Resources directory ("code has no resources but signature indicates they
      # must be present"). Give every bundle a Resources dir, re-seal it ad hoc,
      # then verify strictly. Every validator below still runs on these bundles.
      - name: Ad-hoc sign and strictly verify bundles
        shell: bash
        run: |
          set -euo pipefail
          root=build-ci/GapFill_artefacts/Release
          for bundle in "$root/VST3/GapFill.vst3" "$root/AU/GapFill.component" "$root/CLAP/GapFill.clap" "$GAPFILL_APP"; do
            if [ -d "$bundle" ]; then mkdir -p "$bundle/Contents/Resources"; fi
            codesign --force --deep --sign - "$bundle"
            codesign --verify --deep --strict --verbose=2 "$bundle"
          done

      - name: Validator cache key (refreshed monthly)
        id: month
        shell: bash
        run: echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"

      - name: Restore pluginval
        uses: actions/cache@v4
        with:
          path: pluginval-bin
          key: pluginval-macos-${{ matrix.arch }}-${{ steps.month.outputs.month }}

      - name: Restore clap-validator
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/clap-validator
          key: clap-validator-macos-${{ matrix.arch }}-${{ steps.month.outputs.month }}

      - name: Validate macOS VST3 with pluginval
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d pluginval-bin ]; then
            curl -fL "https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_macOS.zip" -o pluginval.zip
            unzip -q pluginval.zip -d pluginval-bin
          fi
          validator=$(find pluginval-bin -path '*/Contents/MacOS/pluginval' -type f | head -n 1)
          test -n "$validator"
          chmod +x "$validator"
          "$validator" --strictness-level 10 --validate "build-ci/GapFill_artefacts/Release/VST3/GapFill.vst3"

      - name: Validate Audio Unit
        shell: bash
        run: |
          set -euo pipefail
          component="build-ci/GapFill_artefacts/Release/AU/GapFill.component"
          plist="$component/Contents/Info.plist"
          plutil -lint "$plist"
          /usr/libexec/PlistBuddy -c "Print :AudioComponents" "$plist"
          codesign --verify --deep --verbose=2 "$component"
          mkdir -p "$HOME/Library/Audio/Plug-Ins/Components"
          destination="$HOME/Library/Audio/Plug-Ins/Components/GapFill.component"
          rm -rf "$destination"
          ditto "$component" "$destination"
          touch "$destination"
          # JUCE declares aumf (music effect) because the plugin accepts MIDI input.
          # Validate the exact type/subtype/manufacturer from AudioComponents.
          # The AudioComponentRegistrar scans asynchronously on fresh CI machines.
          # Collect discovery evidence; retry at most 8 times without weakening auval.
          killall -9 AudioComponentRegistrar || true
          for attempt in {1..8}; do
            echo "Audio Unit registration attempt $attempt"
            auval -a > auval-components.txt 2>&1 || true
            cat auval-components.txt
            if auval -v aumf Gpfl Gfau; then
              exit 0
            fi
            sleep 5
          done
          echo "Audio Unit was not discoverable after bounded registration attempts"
          exit 1

      - name: Validate macOS CLAP
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.cargo/bin:$PATH"
          if ! command -v clap-validator >/dev/null 2>&1; then
            cargo install --git https://github.com/free-audio/clap-validator --locked clap-validator
          fi
          clap-validator validate --only-failed build-ci/GapFill_artefacts/Release/CLAP/GapFill.clap

      - name: Smoke-launch native standalone
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, subprocess, time
          binary = os.path.join(os.environ["GAPFILL_APP"], "Contents/MacOS/GapFill")
          p = subprocess.Popen([binary], stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
          try:
              time.sleep(5)
              if p.poll() is not None:
                  raise SystemExit(f"GapFill exited early: {p.returncode}")
          finally:
              if p.poll() is None:
                  p.terminate()
                  try:
                      p.wait(timeout=5)
                  except subprocess.TimeoutExpired:
                      p.kill()
                      p.wait()
          PY

      # A tar keeps executable bits and symlinks, which upload-artifact's zip drops.
      # Layout matches packaging/package_macos.sh: VST3/ AU/ CLAP/ Standalone/.
      - name: Stage verified macOS bundles
        shell: bash
        run: |
          set -euo pipefail
          root=build-ci/GapFill_artefacts/Release
          stage="$RUNNER_TEMP/stage"
          rm -rf "$stage"; mkdir -p "$stage/VST3" "$stage/AU" "$stage/CLAP" "$stage/Standalone" macos-artifact
          ditto "$root/VST3/GapFill.vst3" "$stage/VST3/GapFill.vst3"
          ditto "$root/AU/GapFill.component" "$stage/AU/GapFill.component"
          ditto "$root/CLAP/GapFill.clap" "$stage/CLAP/GapFill.clap"
          ditto "$GAPFILL_APP" "$stage/Standalone/GapFill.app"
          tar -cf "macos-artifact/gapfill-macos-${{ matrix.arch }}.tar" -C "$stage" .

      - name: Upload native macOS verified bundles
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: gapfill-macos-${{ matrix.arch }}
          path: macos-artifact/gapfill-macos-${{ matrix.arch }}.tar
          if-no-files-found: error
          retention-days: 90

  # Single required status check: green when every job that had to run passed.
  # Native jobs are legitimately skipped for docs-only changes.
  ci-gate:
    name: CI gate
    needs: [changes, preflight, unit-tests, build-linux-x64, build-windows-x64, package-windows, build-macos]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check results
        shell: bash
        run: |
          set -euo pipefail
          native='${{ needs.changes.outputs.native }}'
          results='${{ needs.changes.result }} ${{ needs.preflight.result }}'
          if [ "$native" = true ]; then
            results="$results ${{ needs.unit-tests.result }} ${{ needs.build-linux-x64.result }} ${{ needs.build-windows-x64.result }} ${{ needs.package-windows.result }} ${{ needs.build-macos.result }}"
          else
            echo "Docs-only change: native jobs skipped"
          fi
          echo "results: $results"
          for r in $results; do
            [ "$r" = success ] || { echo "::error::A required job finished as '$r'"; exit 1; }
          done
