name: CI

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Repository preflight
        run: python tools/validate_repo.py
      - name: Preflight unit tests
        run: python -m unittest tools/test_validate_repo.py
      - name: Release packaging regression test
        run: bash tools/test_package_release.sh

  linux:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install JUCE build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build xvfb libasound2-dev libfreetype-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev \
            libxrandr-dev libxrender-dev

      - name: Fetch JUCE and CLAP support
        run: |
          git clone --depth 1 --branch 8.0.15 https://github.com/juce-framework/JUCE JUCE
          git clone --filter=blob:none --no-checkout https://github.com/free-audio/clap-juce-extensions.git clap-juce-extensions
          git -C clap-juce-extensions checkout 55525c9858d4b25687be7759a5e0f70eccef218e
          git -C clap-juce-extensions submodule update --init --recursive --depth 1

      - name: Configure
        run: cmake -S . -B build-ci -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build tests, VST3, CLAP and Standalone
        run: cmake --build build-ci --target GapFillTests GapFill_VST3 GapFill_CLAP GapFill_Standalone -- -j2

      - name: Run tests
        run: xvfb-run -a build-ci/artefacts/GapFillTests

      - name: Validate VST3 with pluginval
        run: |
          curl -L "https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Linux.zip" -o pluginval.zip
          unzip -q pluginval.zip -d pluginval-bin
          PLUGINVAL=$(find pluginval-bin -type f -name pluginval | head -n 1)
          test -n "$PLUGINVAL"
          chmod +x "$PLUGINVAL"
          VST3=$(find build-ci -type d -name 'GapFill.vst3' | head -n 1)
          test -n "$VST3"
          xvfb-run -a "$PLUGINVAL" --strictness-level 10 --validate "$VST3"

      - name: Validate CLAP with clap-validator
        run: |
          cargo install --git https://github.com/free-audio/clap-validator --locked clap-validator
          CLAP=$(find build-ci -type f -name 'GapFill.clap' | head -n 1)
          test -n "$CLAP"
          clap-validator validate --only-failed "$CLAP"

      - name: Smoke-launch standalone
        run: |
          STANDALONE=$(find build-ci/artefacts -type f -name 'GapFill' -perm -111 | head -n 1)
          test -n "$STANDALONE"
          set +e
          timeout 5s xvfb-run -a "$STANDALONE"
          code=$?
          set -e
          if [ "$code" -ne 124 ]; then
            echo "Standalone exited before the 5-second smoke window (exit $code)"
            exit 1
          fi

  windows:
    needs: preflight
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Fetch JUCE and CLAP support
        shell: pwsh
        run: |
          git clone --depth 1 --branch 8.0.15 https://github.com/juce-framework/JUCE JUCE
          git clone --filter=blob:none --no-checkout https://github.com/free-audio/clap-juce-extensions.git clap-juce-extensions
          git -C clap-juce-extensions checkout 55525c9858d4b25687be7759a5e0f70eccef218e
          git -C clap-juce-extensions submodule update --init --recursive --depth 1

      - name: Configure
        shell: pwsh
        run: cmake -S . -B build-ci -G "Visual Studio 17 2022" -A x64

      - name: Build tests, VST3, CLAP and Standalone
        shell: pwsh
        run: cmake --build build-ci --config Release --target GapFillTests GapFill_VST3 GapFill_CLAP GapFill_Standalone -- /m:2

      - name: Run tests
        shell: pwsh
        run: .\build-ci\artefacts\Release\GapFillTests.exe

      - name: Validate VST3 with pluginval
        shell: pwsh
        run: |
          Invoke-WebRequest "https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip" -OutFile pluginval.zip
          Expand-Archive pluginval.zip -DestinationPath pluginval-bin
          $pluginval = Get-ChildItem pluginval-bin -Recurse -Filter pluginval.exe | Select-Object -First 1
          if (-not $pluginval) { throw "pluginval.exe not found" }
          $vst3 = Get-ChildItem build-ci -Recurse -Directory -Filter GapFill.vst3 | Select-Object -First 1
          if (-not $vst3) { throw "GapFill.vst3 not found" }
          & $pluginval.FullName --strictness-level 10 --validate $vst3.FullName
          if ($LASTEXITCODE -ne 0) { throw "pluginval failed with exit code $LASTEXITCODE" }

      - name: Validate CLAP with clap-validator
        shell: pwsh
        run: |
          cargo install --git https://github.com/free-audio/clap-validator --locked clap-validator
          $clap = Get-ChildItem build-ci -Recurse -File -Filter GapFill.clap | Select-Object -First 1
          if (-not $clap) { throw "GapFill.clap not found" }
          clap-validator validate --only-failed $clap.FullName
          if ($LASTEXITCODE -ne 0) { throw "clap-validator failed with exit code $LASTEXITCODE" }

      - name: Smoke-launch standalone
        shell: pwsh
        run: |
          $standalone = Get-ChildItem build-ci\artefacts -Recurse -File -Filter GapFill.exe | Select-Object -First 1
          if (-not $standalone) { throw "GapFill.exe not found" }
          $process = Start-Process $standalone.FullName -PassThru
          Start-Sleep -Seconds 5
          if ($process.HasExited) {
            throw "Standalone exited before the 5-second smoke window with code $($process.ExitCode)"
          }
          Stop-Process -Id $process.Id -Force

      - name: Upload validated Windows binaries
        uses: actions/upload-artifact@v4
        with:
          name: gapfill-windows-binaries
          if-no-files-found: error
          retention-days: 14
          path: |
            build-ci/GapFill_artefacts/Release/VST3/GapFill.vst3/
            build-ci/GapFill_artefacts/Release/CLAP/GapFill.clap
            build-ci/GapFill_artefacts/JuceLibraryCode/icon.ico
            build-ci/artefacts/Release/GapFill.exe

  package-windows:
    name: Package Windows beta
    needs: [preflight, linux, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Install Windows installer packaging dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends nsis zip unzip file

      - name: Download validated Windows build
        uses: actions/download-artifact@v4
        with:
          name: gapfill-windows-binaries
          path: windows-build

      - name: Package installer and plugin ZIPs
        run: |
          bash packaging/package_release.sh windows-build "" dist

      - name: Verify release packages
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum -c GapFill-0.0.1-beta-SHA256SUMS.txt
          for kind in Setup.exe Portable.zip VST3.zip CLAP.zip; do
            test -s "GapFill-0.0.1-beta-Windows-x64-$kind"
          done
          unzip -Z1 GapFill-0.0.1-beta-Windows-x64-Portable.zip | grep -qx 'GapFill.exe'
          unzip -Z1 GapFill-0.0.1-beta-Windows-x64-VST3.zip | grep -q 'GapFill.vst3/Contents/'
          unzip -Z1 GapFill-0.0.1-beta-Windows-x64-CLAP.zip | grep -qx 'GapFill.clap'
          file GapFill-0.0.1-beta-Windows-x64-Setup.exe | grep -qi 'PE32'

      - name: Upload packaged beta candidate
        uses: actions/upload-artifact@v4
        with:
          name: gapfill-windows-beta-candidate
          if-no-files-found: error
          retention-days: 30
          path: dist/GapFill-0.0.1-beta-*

  publish-windows-beta:
    name: Publish Windows beta prerelease
    needs: [package-windows]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download validated beta packages
        uses: actions/download-artifact@v4
        with:
          name: gapfill-windows-beta-candidate
          path: dist

      - name: Publish exactly once for version 0.0.1-beta
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v0.0.1-beta"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Existing $tag release found; will not overwrite it automatically."
            exit 0
          fi
          cat > beta-notes.md <<'NOTES'
          GapFill 0.0.1 beta for Windows x64.

          Includes standalone, VST3 and CLAP binaries and an NSIS installer.
          Built by GitHub Actions after preflight, JUCE tests, Linux/Windows
          builds, pluginval, clap-validator, standalone smoke tests and package
          checksum/archive checks succeeded.

          This is an unsigned beta. Real-DAW, physical MIDI and audio-interface
          compatibility require additional user testing. Please report issues.
          NOTES
          gh release create "$tag" dist/GapFill-0.0.1-beta-* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "GapFill 0.0.1 beta (Windows x64)" \
            --notes-file beta-notes.md --prerelease
