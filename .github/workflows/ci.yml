name: CI

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Repository preflight
        run: python tools/validate_repo.py
      - name: Preflight unit tests
        run: python -m unittest tools/test_validate_repo.py

  linux:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install JUCE build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build xvfb libasound2-dev libfreetype-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev \
            libxrandr-dev libxrender-dev

      - name: Fetch JUCE and CLAP support
        run: |
          git clone --depth 1 --branch 8.0.15 https://github.com/juce-framework/JUCE JUCE
          git clone --filter=blob:none --no-checkout https://github.com/free-audio/clap-juce-extensions.git clap-juce-extensions
          git -C clap-juce-extensions checkout 55525c9858d4b25687be7759a5e0f70eccef218e
          git -C clap-juce-extensions submodule update --init --recursive --depth 1

      - name: Configure
        run: cmake -S . -B build-ci -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build tests, VST3, CLAP and Standalone
        run: cmake --build build-ci --target GapFillTests GapFill_VST3 GapFill_CLAP GapFill_Standalone -- -j2

      - name: Run tests
        run: xvfb-run -a build-ci/artefacts/GapFillTests

      - name: Validate VST3 with pluginval
        run: |
          curl -L "https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Linux.zip" -o pluginval.zip
          unzip -q pluginval.zip -d pluginval-bin
          PLUGINVAL=$(find pluginval-bin -type f -name pluginval | head -n 1)
          test -n "$PLUGINVAL"
          chmod +x "$PLUGINVAL"
          VST3=$(find build-ci -type d -name 'GapFill.vst3' | head -n 1)
          test -n "$VST3"
          xvfb-run -a "$PLUGINVAL" --strictness-level 10 --validate "$VST3"

      - name: Validate CLAP with clap-validator
        run: |
          cargo install --git https://github.com/free-audio/clap-validator --locked clap-validator
          CLAP=$(find build-ci -type f -name 'GapFill.clap' | head -n 1)
          test -n "$CLAP"
          clap-validator validate --only-failed "$CLAP"

      - name: Smoke-launch standalone
        run: |
          STANDALONE=$(find build-ci/artefacts -type f -name 'GapFill' -perm -111 | head -n 1)
          test -n "$STANDALONE"
          set +e
          timeout 5s xvfb-run -a "$STANDALONE"
          code=$?
          set -e
          if [ "$code" -ne 124 ]; then
            echo "Standalone exited before the 5-second smoke window (exit $code)"
            exit 1
          fi

  windows:
    needs: preflight
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Fetch JUCE and CLAP support
        shell: pwsh
        run: |
          git clone --depth 1 --branch 8.0.15 https://github.com/juce-framework/JUCE JUCE
          git clone --filter=blob:none --no-checkout https://github.com/free-audio/clap-juce-extensions.git clap-juce-extensions
          git -C clap-juce-extensions checkout 55525c9858d4b25687be7759a5e0f70eccef218e
          git -C clap-juce-extensions submodule update --init --recursive --depth 1

      - name: Configure
        shell: pwsh
        run: cmake -S . -B build-ci -G "Visual Studio 17 2022" -A x64

      - name: Build tests, VST3, CLAP and Standalone
        shell: pwsh
        run: cmake --build build-ci --config Release --target GapFillTests GapFill_VST3 GapFill_CLAP GapFill_Standalone -- /m:2

      - name: Run tests
        shell: pwsh
        run: .\build-ci\artefacts\Release\GapFillTests.exe

      - name: Validate VST3 with pluginval
        shell: pwsh
        run: |
          Invoke-WebRequest "https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip" -OutFile pluginval.zip
          Expand-Archive pluginval.zip -DestinationPath pluginval-bin
          $pluginval = Get-ChildItem pluginval-bin -Recurse -Filter pluginval.exe | Select-Object -First 1
          if (-not $pluginval) { throw "pluginval.exe not found" }
          $vst3 = Join-Path $PWD 'build-ci\GapFill_artefacts\Release\VST3\GapFill.vst3'
          if (-not (Test-Path $vst3 -PathType Container)) { throw "Release VST3 bundle not found at $vst3" }
          $vst3Binary = Get-ChildItem $vst3 -Recurse -File -Filter GapFill.vst3 | Select-Object -First 1
          if (-not $vst3Binary) { throw "Release VST3 binary missing from $vst3" }
          # pluginval is a Windows GUI-subsystem executable: direct invocation can
          # return before the validator finishes, leaving LASTEXITCODE unset.
          # Wait explicitly and retain separate output streams for failure triage.
          New-Item -ItemType Directory -Force -Path pluginval-diagnostics | Out-Null
          $stdout = Join-Path $PWD 'pluginval-diagnostics/pluginval-stdout.log'
          $stderr = Join-Path $PWD 'pluginval-diagnostics/pluginval-stderr.log'
          $arguments = "--strictness-level 10 --validate `"$vst3`""
          $validation = Start-Process -FilePath $pluginval.FullName -ArgumentList $arguments -Wait -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          if (Test-Path $stdout) { Get-Content $stdout }
          if (Test-Path $stderr) { Get-Content $stderr }
          if ($validation.ExitCode -ne 0) { throw "pluginval failed with exit code $($validation.ExitCode); inspect uploaded diagnostics" }

      - name: Upload Windows pluginval diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-pluginval-diagnostics
          path: pluginval-diagnostics/
          if-no-files-found: ignore
          retention-days: 14

      - name: Validate CLAP with clap-validator
        if: ${{ success() || failure() }}
        shell: pwsh
        run: |
          cargo install --git https://github.com/free-audio/clap-validator --locked clap-validator
          $clap = Join-Path $PWD 'build-ci\GapFill_artefacts\Release\CLAP\GapFill.clap'
          if (-not (Test-Path $clap -PathType Leaf)) { throw "Release CLAP binary not found at $clap" }
          clap-validator validate --only-failed $clap
          if ($LASTEXITCODE -ne 0) { throw "clap-validator failed with exit code $LASTEXITCODE" }

      - name: Smoke-launch standalone
        if: ${{ success() || failure() }}
        shell: pwsh
        run: |
          $standalone = Join-Path $PWD 'build-ci\artefacts\Release\GapFill.exe'
          if (-not (Test-Path $standalone -PathType Leaf)) { throw "Release standalone missing at $standalone" }
          $process = Start-Process $standalone -PassThru
          Start-Sleep -Seconds 5
          if ($process.HasExited) {
            throw "Standalone exited before the 5-second smoke window with code $($process.ExitCode)"
          }
          Stop-Process -Id $process.Id -Force

  macos:
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4

      - name: Verify native architecture and tools
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "${{ matrix.arch }}"
          xcodebuild -version
          cmake --version

      - name: Fetch JUCE and CLAP support
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch 8.0.15 https://github.com/juce-framework/JUCE JUCE
          git clone --filter=blob:none --no-checkout https://github.com/free-audio/clap-juce-extensions.git clap-juce-extensions
          git -C clap-juce-extensions checkout 55525c9858d4b25687be7759a5e0f70eccef218e
          git -C clap-juce-extensions submodule update --init --recursive --depth 1

      - name: Configure Release for native architecture
        shell: bash
        run: cmake -S . -B build-ci -G Xcode -DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch }} -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0

      - name: Build tests, VST3, AU, CLAP and Standalone
        shell: bash
        run: cmake --build build-ci --config Release --target GapFillTests GapFill_VST3 GapFill_AU GapFill_CLAP GapFill_Standalone --parallel 2

      - name: Run unit and combinatorial tests
        shell: bash
        run: |
          set -euo pipefail
          build-ci/artefacts/Release/GapFillTests

      - name: Verify native bundles and architecture
        shell: bash
        run: |
          set -euo pipefail
          root=build-ci/GapFill_artefacts/Release
          for format in VST3 AU CLAP; do
            test -d "$root/$format" || { echo "Missing $format bundle directory"; exit 1; }
          done
          vst3="$root/VST3/GapFill.vst3"
          au="$root/AU/GapFill.component"
          clap="$root/CLAP/GapFill.clap"
          app="build-ci/artefacts/Release/GapFill.app"
          test -d "$vst3"
          test -d "$au"
          test -e "$clap"
          test -d "$app"
          find "$vst3" "$au" "$app" -type f -print | head -40
          # Explicitly fail on missing or wrong-architecture executables.
          for bundle in "$vst3" "$au" "$app"; do
            binary="$bundle/Contents/MacOS/GapFill"
            test -f "$binary"
            lipo "$binary" -verify_arch "${{ matrix.arch }}"
          done
          if [ -f "$clap" ]; then
            lipo "$clap" -verify_arch "${{ matrix.arch }}"
          else
            test -f "$clap/Contents/MacOS/GapFill"
            lipo "$clap/Contents/MacOS/GapFill" -verify_arch "${{ matrix.arch }}"
          fi

      - name: Validate macOS VST3 with pluginval
        shell: bash
        run: |
          set -euo pipefail
          curl -fL "https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_macOS.zip" -o pluginval.zip
          unzip -q pluginval.zip -d pluginval-bin
          validator=$(find pluginval-bin -path '*/Contents/MacOS/pluginval' -type f | head -n 1)
          test -n "$validator"
          chmod +x "$validator"
          "$validator" --strictness-level 10 --validate "build-ci/GapFill_artefacts/Release/VST3/GapFill.vst3"

      - name: Validate Audio Unit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/Library/Audio/Plug-Ins/Components"
          cp -R "build-ci/GapFill_artefacts/Release/AU/GapFill.component" "$HOME/Library/Audio/Plug-Ins/Components/"
          # Force the AudioComponentRegistrar to rescan the new component.
          killall -9 AudioComponentRegistrar || true
          auval -v aufx Gpfl Gfau

      - name: Validate macOS CLAP
        shell: bash
        run: |
          set -euo pipefail
          cargo install --git https://github.com/free-audio/clap-validator --locked clap-validator
          clap-validator validate --only-failed build-ci/GapFill_artefacts/Release/CLAP/GapFill.clap

      - name: Smoke-launch native standalone
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess, time
          binary = "build-ci/artefacts/Release/GapFill.app/Contents/MacOS/GapFill"
          p = subprocess.Popen([binary], stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
          try:
              time.sleep(5)
              if p.poll() is not None:
                  raise SystemExit(f"GapFill exited early: {p.returncode}")
          finally:
              if p.poll() is None:
                  p.terminate()
                  try:
                      p.wait(timeout=5)
                  except subprocess.TimeoutExpired:
                      p.kill()
                      p.wait()
          PY

      - name: Upload native macOS candidate bundles
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: gapfill-macos-${{ matrix.arch }}-verified
          path: |
            build-ci/GapFill_artefacts/Release/VST3/GapFill.vst3/
            build-ci/GapFill_artefacts/Release/AU/GapFill.component/
            build-ci/GapFill_artefacts/Release/CLAP/GapFill.clap
            build-ci/artefacts/Release/GapFill.app/
          if-no-files-found: error
          retention-days: 14
